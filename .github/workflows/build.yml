name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact:     CrunchyExporter.exe
            release_name: CrunchyExporter-windows-x64.exe
          - os: ubuntu-latest
            artifact:     CrunchyExporter
            release_name: CrunchyExporter-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build — Windows
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller
          --onefile
          --windowed
          --name=CrunchyExporter
          --icon=crunchyexporterlogo.ico
          "--add-data=locales;locales"
          "--add-data=crunchyexporterlogo.png;."
          "--add-data=config.example.yaml;."
          --collect-data=customtkinter
          main.py

      - name: Build — Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq python3-tk
          python -m PyInstaller \
            --onefile \
            --name=CrunchyExporter \
            --add-data="locales:locales" \
            --add-data="crunchyexporterlogo.png:." \
            --add-data="config.example.yaml:." \
            --collect-data=customtkinter \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: dist/${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          name: ${{ matrix.release_name }}
